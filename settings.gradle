pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'create-gunsmithing-fabric'
include 'gunsmithing', 'ntgl'
project(':gunsmithing').projectDir = file('ports/gunsmithing')
project(':ntgl').projectDir = file('dependencies/ntgl/ports/ntgl')
